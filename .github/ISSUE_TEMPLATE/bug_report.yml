name: Bug report
description: Report broken filtering or extension behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste a Jev API key or private account data.
  - type: input
    id: version
    attributes:
      label: TopicLens version
      placeholder: 1.1.0
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: YouTube surface
      options: [Home, Search, Watch recommendations, Shorts, Other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and safe reproduction steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Chrome version, operating system, extension errors with secrets removed
